---
# Nexa Commerce - storefront workload.
#
# CH-109 F5 - Using Unrecommended Namespace (expect: Medium)
#
# The workload is deployed into the default namespace. Everything with
# default-namespace access can reach it, and namespace-scoped policy
# cannot be applied to it separately from anything else in the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexa-storefront
  namespace: default
  labels:
    app: nexa-storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexa-storefront
  template:
    metadata:
      labels:
        app: nexa-storefront
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: storefront
          image: ghcr.io/nexa-commerce/storefront:1.0.0
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /index.php
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexa-storefront
  namespace: default
spec:
  selector:
    app: nexa-storefront
  ports:
    - port: 80
      targetPort: 8080
